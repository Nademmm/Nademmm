<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 4px; fill: #f5a623; }
  .cat { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 2px; fill: #818cf8; }
  .pill-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 12px; fill: #ffffff; }
  .corner { stroke: #6366f1; stroke-width: 2; fill: none; opacity: .8; }
  .glowbar { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
</style>

<radialGradient id="bgGrad" cx="50%" cy="15%" r="90%">
  <stop offset="0%" stop-color="#161022"/>
  <stop offset="45%" stop-color="#0a0713"/>
  <stop offset="100%" stop-color="#020103"/>
</radialGradient>

<linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#6366f1"><animate attributeName="stop-color" values="#6366f1;#38bdf8;#34d399;#f5a623;#6366f1" dur="8s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#f43f5e;#6366f1;#38bdf8;#a855f7" dur="8s" repeatCount="indefinite"/></stop>
</linearGradient>
</defs>

<!-- Background -->
<rect width="900" height="520" rx="16" fill="url(#bgGrad)"/>
<rect x="10" y="10" width="880" height="500" rx="12" fill="none" stroke="url(#frameGrad)" stroke-width="2" opacity="0.6"/>

<!-- Grid Background -->
<g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
  <line x1="0" y1="80" x2="900" y2="80"/><line x1="0" y1="220" x2="900" y2="220"/><line x1="0" y1="360" x2="900" y2="360"/>
  <line x1="225" y1="0" x2="225" y2="520"/><line x1="450" y1="0" x2="450" y2="520"/><line x1="675" y1="0" x2="675" y2="520"/>
</g>

<!-- Corners -->
<path class="corner" d="M 25 35 L 25 25 L 35 25"/>
<path class="corner" d="M 865 25 L 875 25 L 875 35"/>
<path class="corner" d="M 25 485 L 25 495 L 35 495"/>
<path class="corner" d="M 865 495 L 875 495 L 875 485"/>

<!-- Title Header -->
<text x="45" y="52" class="title">// TECHNICAL CAPABILITIES &amp; STACK</text>
<line x1="35" y1="70" x2="865" y2="70" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

<!-- Category 1: Frontend & 3D -->
<g transform="translate(45, 95)">
  <text x="0" y="15" class="cat">01. FRONTEND ARCHITECTURE &amp; 3D GRAPHICS</text>
  
  <!-- Row 1 Pills -->
  <rect x="0" y="30" width="100" height="34" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
  <text x="50" y="52" class="pill-text" text-anchor="middle">React 19</text>
  
  <rect x="115" y="30" width="110" height="34" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="170" y="52" class="pill-text" text-anchor="middle">Next.js 16</text>
  
  <rect x="240" y="30" width="120" height="34" rx="6" fill="#1e1b4b" stroke="#3178c6" stroke-width="1.2"/>
  <text x="300" y="52" class="pill-text" text-anchor="middle">TypeScript</text>
  
  <rect x="375" y="30" width="130" height="34" rx="6" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="440" y="52" class="pill-text" text-anchor="middle">Tailwind CSS</text>
  
  <rect x="520" y="30" width="90" height="34" rx="6" fill="#1e1b4b" stroke="#646cff" stroke-width="1.2"/>
  <text x="565" y="52" class="pill-text" text-anchor="middle">Vite</text>
  
  <rect x="625" y="30" width="105" height="34" rx="6" fill="#1e1b4b" stroke="#ffffff" stroke-width="1.2"/>
  <text x="677" y="52" class="pill-text" text-anchor="middle">Three.js</text>
  
  <rect x="745" y="30" width="95" height="34" rx="6" fill="#1e1b4b" stroke="#990000" stroke-width="1.2"/>
  <text x="792" y="52" class="pill-text" text-anchor="middle">WebGL</text>
</g>

<!-- Category 2: Backend & Database -->
<g transform="translate(45, 230)">
  <text x="0" y="15" class="cat">02. BACKEND ECOSYSTEM &amp; DATABASES</text>
  
  <rect x="0" y="30" width="110" height="34" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.2"/>
  <text x="55" y="52" class="pill-text" text-anchor="middle">Node.js</text>
  
  <rect x="125" y="30" width="120" height="34" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.2"/>
  <text x="185" y="52" class="pill-text" text-anchor="middle">Express.js</text>
  
  <rect x="260" y="30" width="125" height="34" rx="6" fill="#78350f" stroke="#ff2d20" stroke-width="1.2"/>
  <text x="322" y="52" class="pill-text" text-anchor="middle">Laravel 11</text>
  
  <rect x="400" y="30" width="85" height="34" rx="6" fill="#78350f" stroke="#777bb4" stroke-width="1.2"/>
  <text x="442" y="52" class="pill-text" text-anchor="middle">PHP 8+</text>
  
  <rect x="500" y="30" width="120" height="34" rx="6" fill="#064e3b" stroke="#3ecf8e" stroke-width="1.2"/>
  <text x="560" y="52" class="pill-text" text-anchor="middle">Supabase</text>
  
  <rect x="635" y="30" width="100" height="34" rx="6" fill="#1e1b4b" stroke="#4479a1" stroke-width="1.2"/>
  <text x="685" y="52" class="pill-text" text-anchor="middle">MySQL</text>
  
  <rect x="750" y="30" width="120" height="34" rx="6" fill="#1e1b4b" stroke="#4169e1" stroke-width="1.2"/>
  <text x="810" y="52" class="pill-text" text-anchor="middle">PostgreSQL</text>
</g>

<!-- Category 3: DevOps & Cloud -->
<g transform="translate(45, 365)">
  <text x="0" y="15" class="cat">03. DEVOPS, CLOUD INFRA &amp; TOOLS</text>
  
  <rect x="0" y="30" width="105" height="34" rx="6" fill="#1e1b4b" stroke="#2496ed" stroke-width="1.2"/>
  <text x="52" y="52" class="pill-text" text-anchor="middle">Docker</text>
  
  <rect x="120" y="30" width="150" height="34" rx="6" fill="#1e1b4b" stroke="#2088ff" stroke-width="1.2"/>
  <text x="195" y="52" class="pill-text" text-anchor="middle">GitHub Actions</text>
  
  <rect x="285" y="30" width="130" height="34" rx="6" fill="#78350f" stroke="#fcc624" stroke-width="1.2"/>
  <text x="350" y="52" class="pill-text" text-anchor="middle">Linux Server</text>
  
  <rect x="430" y="30" width="100" height="34" rx="6" fill="#064e3b" stroke="#009639" stroke-width="1.2"/>
  <text x="480" y="52" class="pill-text" text-anchor="middle">Nginx</text>
  
  <rect x="545" y="30" width="85" height="34" rx="6" fill="#78350f" stroke="#f05032" stroke-width="1.2"/>
  <text x="587" y="52" class="pill-text" text-anchor="middle">Git</text>
  
  <rect x="645" y="30" width="95" height="34" rx="6" fill="#4c1d95" stroke="#f24e1e" stroke-width="1.2"/>
  <text x="692" y="52" class="pill-text" text-anchor="middle">Figma</text>
</g>

</svg>
