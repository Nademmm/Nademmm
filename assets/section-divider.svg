<svg viewBox="0 0 900 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="divider-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363D" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#30363D" stop-opacity="0.3" />
    </linearGradient>

    <style>
      @keyframes pulse-divider {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes pulse-dot {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.5); opacity: 1; }
      }
      .div-glow {
        animation: pulse-divider 3s infinite ease-in-out;
      }
      .end-dot-left {
        animation: pulse-dot 2s infinite ease-in-out;
        transform-origin: 0px 16px;
      }
      .end-dot-right {
        animation: pulse-dot 2s infinite ease-in-out;
        transform-origin: 900px 16px;
      }
    </style>
  </defs>

  <line x1="0" y1="16" x2="410" y2="16" stroke="url(#divider-glow)" stroke-width="1.2" class="div-glow"/>
  <line x1="490" y1="16" x2="900" y2="16" stroke="url(#divider-glow)" stroke-width="1.2" class="div-glow"/>

  <rect x="430" y="6" width="40" height="20" fill="#0D1117" stroke="#30363D" stroke-width="1" rx="4"/>
  <text x="450" y="20" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" fill="#58A6FF" font-weight="bold">//</text>

  <circle cx="0" cy="16" r="3" fill="#58A6FF" class="end-dot-left"/>
  <circle cx="900" cy="16" r="3" fill="#58A6FF" class="end-dot-right"/>
</svg>
