  <text x="450" y="66" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="10.5" letter-spacing="3" fill="#58A6FF" opacity="0.4">NAADHIM_FAHLY ✦ FULL_STACK_ENGINEER ✦ NAADHIM_FAHLY ✦ FULL_STACK_ENGINEER</text>
