<svg viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Naadhim Fahly — Full Stack Engineer">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363D" opacity="0.55"/>
    </pattern>

    <linearGradient id="glow-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes pulse-dot {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.6); opacity: 0.4; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes scanline {
        0% { transform: translateX(-900px); }
        100% { transform: translateX(900px); }
      }
      @keyframes text-glow {
        0%, 100% { text-shadow: 0 0 10px rgba(88, 166, 255, 0.2); }
        50% { text-shadow: 0 0 20px rgba(88, 166, 255, 0.7); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      .dot-pulse {
        animation: pulse-dot 2s infinite ease-in-out;
        transform-origin: 716px 197px;
      }
      .blue-dot-pulse {
        animation: pulse-dot 2.5s infinite ease-in-out;
        transform-origin: 860px 40px;
      }
      .scan-anim {
        animation: scanline 4s linear infinite;
      }
      .role-glow {
        animation: text-glow 3s infinite ease-in-out;
      }
      .cursor-blink {
        animation: blink 1s infinite;
      }
    </style>
  </defs>

  <!-- base background -->
  <rect x="0" y="0" width="900" height="240" fill="#0D1117"/>
  <rect x="0" y="0" width="900" height="240" fill="url(#grid)"/>

  <!-- moving scanline effect -->
  <rect x="0" y="0" width="300" height="240" fill="url(#glow-gradient)" class="scan-anim" opacity="0.15"/>

  <!-- outer frame -->
  <rect x="1" y="1" width="898" height="238" fill="none" stroke="#30363D" stroke-width="1"/>

  <!-- corner brackets -->
  <path d="M 24 24 L 24 44 M 24 24 L 44 24" stroke="#58A6FF" stroke-width="1.5" fill="none"/>
  <path d="M 876 216 L 876 196 M 876 216 L 856 216" stroke="#58A6FF" stroke-width="1.5" fill="none"/>

  <!-- eyebrow index -->
  <text x="32" y="44" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" letter-spacing="2" fill="#8B949E">N.01 — DEVELOPER_PROFILE</text>
  <circle cx="860" cy="40" r="3" fill="#58A6FF" class="blue-dot-pulse"/>
  <text x="850" y="44" text-anchor="end" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" letter-spacing="1.5" fill="#8B949E">SIDOARJO, ID</text>

  <!-- name -->
  <text x="32" y="118" font-family="'JetBrains Mono','Courier New',monospace" font-size="46" font-weight="700" letter-spacing="1" fill="#F0F6FC">NAADHIM FAHLY</text>

  <!-- role line -->
  <text x="32" y="148" font-family="'JetBrains Mono','Courier New',monospace" font-size="15" letter-spacing="3" fill="#58A6FF" class="role-glow">FULL STACK ENGINEER</text>
  <text x="292" y="148" font-family="'JetBrains Mono','Courier New',monospace" font-size="15" letter-spacing="1" fill="#8B949E">/ NETWORK ENGINEERING STUDENT</text>
  <rect x="745" y="136" width="2" height="15" fill="#58A6FF" class="cursor-blink"/>

  <!-- rule -->
  <line x1="32" y1="168" x2="868" y2="168" stroke="#30363D" stroke-width="1"/>

  <!-- tagline -->
  <text x="32" y="196" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#8B949E">Building useful things, learning continuously, and turning ideas into software.</text>

  <!-- status pill with animated pulsing dot -->
  <rect x="700" y="184" width="168" height="26" rx="13" fill="none" stroke="#30363D" stroke-width="1"/>
  <circle cx="716" cy="197" r="4" fill="#3FB950" class="dot-pulse"/>
  <text x="730" y="201" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" letter-spacing="1" fill="#F0F6FC">OPEN FOR COLLAB</text>
</svg>
