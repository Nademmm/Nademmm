<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 4px; fill: #38bdf8; }
  .stat-label { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 2px; fill: #94a3b8; }
  .stat-val { font-family: 'Fira Code', Consolas, monospace; font-weight: 800; font-size: 20px; fill: #34d399; }
  .corner { stroke: #38bdf8; stroke-width: 2; fill: none; opacity: .8; }
  .glowbar { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes laser { 0% { transform: translateX(-50px); } 100% { transform: translateX(920px); } }
  
  .c0 { fill: #0f172a; opacity: 0.6; }
  .c1 { fill: #1e1b4b; }
  .c2 { fill: #4338ca; }
  .c3 { fill: #6366f1; }
  .c4 { fill: #38bdf8; }
  .c5 { fill: #34d399; }
  
  .pulse-cell { animation: cellPulse 3s ease-in-out infinite; }
  @keyframes cellPulse { 0%, 100% { fill: #38bdf8; } 50% { fill: #34d399; } }
</style>

<radialGradient id="bgGrad" cx="50%" cy="15%" r="90%">
  <stop offset="0%" stop-color="#161022"/>
  <stop offset="45%" stop-color="#0a0713"/>
  <stop offset="100%" stop-color="#020103"/>
</radialGradient>

<linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#34d399;#6366f1;#f5a623;#38bdf8" dur="8s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#34d399"><animate attributeName="stop-color" values="#34d399;#6366f1;#f5a623;#38bdf8;#34d399" dur="8s" repeatCount="indefinite"/></stop>
</linearGradient>

<linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
  <stop offset="50%" stop-color="#34d399" stop-opacity="0.8"/>
  <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
</linearGradient>
</defs>

<!-- Background -->
<rect width="900" height="320" rx="16" fill="url(#bgGrad)"/>
<rect x="10" y="10" width="880" height="300" rx="12" fill="none" stroke="url(#frameGrad)" stroke-width="2" opacity="0.6"/>

<!-- Corners -->
<path class="corner" d="M 25 35 L 25 25 L 35 25"/>
<path class="corner" d="M 865 25 L 875 25 L 875 35"/>
<path class="corner" d="M 25 285 L 25 295 L 35 295"/>
<path class="corner" d="M 865 295 L 875 295 L 875 285"/>

<!-- Title Header -->
<circle cx="45" cy="48" r="5" fill="#38bdf8" class="glowbar"/>
<text x="60" y="53" class="title">// GITHUB CONTRIBUTION MATRIX &amp; ACTIVITY</text>
<line x1="35" y1="70" x2="865" y2="70" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

<!-- Stat Metrics Cards -->
<g transform="translate(45, 85)">
  <rect x="0" y="0" width="250" height="60" rx="6" fill="#1e1b4b" fill-opacity="0.5" stroke="#6366f1" stroke-width="1"/>
  <text x="15" y="24" class="stat-label">TOTAL CONTRIBUTIONS</text>
  <text x="15" y="48" class="stat-val" fill="#38bdf8">1,480+ COMMITS</text>
  
  <rect x="280" y="0" width="250" height="60" rx="6" fill="#064e3b" fill-opacity="0.5" stroke="#34d399" stroke-width="1"/>
  <text x="15" y="24" class="stat-label">CURRENT STREAK</text>
  <text x="15" y="48" class="stat-val" fill="#34d399">42 DAYS ACTIVE</text>

  <rect x="560" y="0" width="250" height="60" rx="6" fill="#78350f" fill-opacity="0.5" stroke="#f5a623" stroke-width="1"/>
  <text x="15" y="24" class="stat-label">LONGEST STREAK</text>
  <text x="15" y="48" class="stat-val" fill="#fbbf24">128 DAYS STREAK</text>
</g>

