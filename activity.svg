<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 4px; fill: #a855f7; }
  .label { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 1px; fill: #ffffff; }
  .perc { font-family: 'Fira Code', Consolas, monospace; font-weight: 800; font-size: 13px; fill: #38bdf8; }
  .metric-title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 2px; fill: #94a3b8; }
  .metric-value { font-family: 'Fira Code', Consolas, monospace; font-weight: 800; font-size: 24px; fill: #34d399; }
  .corner { stroke: #a855f7; stroke-width: 2; fill: none; opacity: .8; }
  .glowbar { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  
  .bar-grow-1 { animation: grow1 2s ease-out forwards; }
  .bar-grow-2 { animation: grow2 2s ease-out forwards; }
  .bar-grow-3 { animation: grow3 2s ease-out forwards; }
  .bar-grow-4 { animation: grow4 2s ease-out forwards; }
  
  @keyframes grow1 { 0% { width: 0; } 100% { width: 380px; } }
  @keyframes grow2 { 0% { width: 0; } 100% { width: 220px; } }
  @keyframes grow3 { 0% { width: 0; } 100% { width: 170px; } }
  @keyframes grow4 { 0% { width: 0; } 100% { width: 85px; } }
</style>

<radialGradient id="bgGrad" cx="50%" cy="15%" r="90%">
  <stop offset="0%" stop-color="#161022"/>
  <stop offset="45%" stop-color="#0a0713"/>
  <stop offset="100%" stop-color="#020103"/>
</radialGradient>

<linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#38bdf8;#34d399;#f5a623;#a855f7" dur="8s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#6366f1"><animate attributeName="stop-color" values="#6366f1;#f43f5e;#38bdf8;#34d399;#6366f1" dur="8s" repeatCount="indefinite"/></stop>
</linearGradient>
</defs>

<!-- Background -->
<rect width="900" height="360" rx="16" fill="url(#bgGrad)"/>
<rect x="10" y="10" width="880" height="340" rx="12" fill="none" stroke="url(#frameGrad)" stroke-width="2" opacity="0.6"/>

<!-- Corners -->
<path class="corner" d="M 25 35 L 25 25 L 35 25"/>
<path class="corner" d="M 865 25 L 875 25 L 875 35"/>
<path class="corner" d="M 25 325 L 25 335 L 35 335"/>
<path class="corner" d="M 865 335 L 875 335 L 875 325"/>

<!-- Title Header -->
<circle cx="45" cy="48" r="5" fill="#a855f7" class="glowbar"/>
<text x="60" y="53" class="title">// GITHUB SYSTEM METRICS &amp; LANGUAGE SPLIT</text>
<line x1="35" y1="70" x2="865" y2="70" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

<!-- Left Side: Language Progress Bars -->
<g transform="translate(45, 95)">
  <!-- Bar 1: TypeScript & JS -->
  <text x="0" y="15" class="label">TypeScript &amp; JavaScript</text>
  <text x="430" y="15" class="perc" fill="#38bdf8">45%</text>
  <rect x="0" y="25" width="450" height="12" rx="6" fill="#1e1b4b"/>
  <rect x="0" y="25" width="380" height="12" rx="6" fill="#38bdf8" class="bar-grow-1"/>
  
  <!-- Bar 2: PHP & Laravel -->
  <text x="0" y="65" class="label">PHP &amp; Laravel Ecosystem</text>
  <text x="430" y="65" class="perc" fill="#ff2d20">26%</text>
  <rect x="0" y="75" width="450" height="12" rx="6" fill="#1e1b4b"/>
  <rect x="0" y="75" width="220" height="12" rx="6" fill="#ff2d20" class="bar-grow-2"/>

  <!-- Bar 3: React & Next.js -->
  <text x="0" y="115" class="label">React &amp; Next.js 16 Framework</text>
  <text x="430" y="115" class="perc" fill="#61dafb">19%</text>
  <rect x="0" y="125" width="450" height="12" rx="6" fill="#1e1b4b"/>
  <rect x="0" y="125" width="170" height="12" rx="6" fill="#61dafb" class="bar-grow-3"/>

  <!-- Bar 4: HTML, CSS & Bash -->
  <text x="0" y="165" class="label">HTML, CSS, Shell &amp; Dockerfile</text>
  <text x="430" y="165" class="perc" fill="#34d399">10%</text>
  <rect x="0" y="175" width="450" height="12" rx="6" fill="#1e1b4b"/>
  <rect x="0" y="175" width="85" height="12" rx="6" fill="#34d399" class="bar-grow-4"/>
</g>

<!-- Right Side: Key Activity Stat Cards -->
<g transform="translate(545, 95)">
  <!-- Card 1 -->
  <rect x="0" y="0" width="150" height="95" rx="8" fill="#1e1b4b" fill-opacity="0.5" stroke="#6366f1" stroke-width="1.2"/>
  <text x="18" y="28" class="metric-title">REPOSITORIES</text>
  <text x="18" y="65" class="metric-value" fill="#818cf8">24+</text>

  <!-- Card 2 -->
  <rect x="165" y="0" width="155" height="95" rx="8" fill="#064e3b" fill-opacity="0.5" stroke="#34d399" stroke-width="1.2"/>
  <text x="18" y="28" class="metric-title">PULL REQUESTS</text>
  <text x="18" y="65" class="metric-value" fill="#34d399">95+</text>

  <!-- Card 3 -->
  <rect x="0" y="110" width="150" height="95" rx="8" fill="#78350f" fill-opacity="0.5" stroke="#f5a623" stroke-width="1.2"/>
  <text x="18" y="28" class="metric-title">CODE REVIEWS</text>
  <text x="18" y="65" class="metric-value" fill="#fbbf24">120+</text>

  <!-- Card 4 -->
  <rect x="165" y="110" width="155" height="95" rx="8" fill="#4c1d95" fill-opacity="0.5" stroke="#a855f7" stroke-width="1.2"/>
  <text x="18" y="28" class="metric-title">TOTAL COMMITS</text>
  <text x="18" y="65" class="metric-value" fill="#c084fc">850+</text>
</g>

</svg>
