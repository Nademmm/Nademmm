<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 18px; fill: #58a6ff; }
  .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #c9d1d9; }
  .perc { font-family: monospace; font-weight: 700; font-size: 13px; fill: #58a6ff; }
  .metric-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #8b949e; letter-spacing: 1px; }
  .metric-value { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 22px; fill: #3fb950; }
</style>

<linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#38bdf8"/>
  <stop offset="100%" stop-color="#818cf8"/>
</linearGradient>
<linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#ff2d20"/>
  <stop offset="100%" stop-color="#f5a623"/>
</linearGradient>
<linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#61dafb"/>
  <stop offset="100%" stop-color="#38bdf8"/>
</linearGradient>
<linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#3fb950"/>
  <stop offset="100%" stop-color="#2ea043"/>
</linearGradient>
</defs>

<!-- Main Container -->
<rect width="900" height="260" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

<!-- Header -->
<text x="30" y="40" class="title">⚡ LANGUAGE &amp; SYSTEM METRICS</text>
<line x1="30" y1="55" x2="870" y2="55" stroke="#21262d" stroke-width="1"/>

<!-- Left Side: Language Bars -->
<g transform="translate(30, 75)">
  <!-- Item 1 -->
  <text x="0" y="15" class="label">TypeScript / JavaScript</text>
  <text x="350" y="15" class="perc" fill="#38bdf8">45%</text>
  <rect x="0" y="24" width="390" height="8" rx="4" fill="#21262d"/>
  <rect x="0" y="24" width="175" height="8" rx="4" fill="url(#bar1)"/>

  <!-- Item 2 -->
  <text x="0" y="55" class="label">PHP &amp; Laravel Ecosystem</text>
  <text x="350" y="55" class="perc" fill="#f5a623">26%</text>
  <rect x="0" y="64" width="390" height="8" rx="4" fill="#21262d"/>
  <rect x="0" y="64" width="101" height="8" rx="4" fill="url(#bar2)"/>

  <!-- Item 3 -->
  <text x="0" y="95" class="label">React &amp; Next.js 16</text>
  <text x="350" y="95" class="perc" fill="#61dafb">19%</text>
  <rect x="0" y="104" width="390" height="8" rx="4" fill="#21262d"/>
  <rect x="0" y="104" width="74" height="8" rx="4" fill="url(#bar3)"/>

  <!-- Item 4 -->
  <text x="0" y="135" class="label">HTML, CSS, Shell &amp; Docker</text>
  <text x="350" y="135" class="perc" fill="#3fb950">10%</text>
  <rect x="0" y="144" width="390" height="8" rx="4" fill="#21262d"/>
  <rect x="0" y="144" width="40" height="8" rx="4" fill="url(#bar4)"/>
</g>

<!-- Vertical Separator Line -->
<line x1="465" y1="70" x2="465" y2="230" stroke="#21262d" stroke-width="1"/>

<!-- Right Side: Stat Metric Boxes -->
<g transform="translate(490, 75)">
  <!-- Box 1: Repos -->
  <rect x="0" y="0" width="180" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="16" y="24" class="metric-title">REPOSITORIES</text>
  <text x="16" y="52" class="metric-value" fill="#58a6ff">24+</text>

  <!-- Box 2: PRs -->
  <rect x="195" y="0" width="185" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="16" y="24" class="metric-title">PULL REQUESTS</text>
  <text x="16" y="52" class="metric-value" fill="#3fb950">95+</text>

  <!-- Box 3: Reviews -->
  <rect x="0" y="82" width="180" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="16" y="24" class="metric-title">CODE REVIEWS</text>
  <text x="16" y="52" class="metric-value" fill="#d29922">120+</text>

  <!-- Box 4: Commits -->
  <rect x="195" y="82" width="185" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="16" y="24" class="metric-title">TOTAL COMMITS</text>
  <text x="16" y="52" class="metric-value" fill="#a371f7">850+</text>
</g>

</svg>
